{{- if not .Values.adminToken.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fleet-rollout.name" . }}-admin
  labels:
    {{- include "fleet-rollout.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-token: {{ required "adminToken.value or adminToken.existingSecret is required" .Values.adminToken.value | quote }}
{{- end }}
{{- if not .Values.database.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fleet-rollout.name" . }}-database
  labels:
    {{- include "fleet-rollout.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.database.url }}
  database-url: {{ .Values.database.url | quote }}
  {{- else if .Values.postgres.enabled }}
  database-url: {{ printf "postgres://rollout:%s@%s-postgres:5432/rollout?sslmode=disable" (required "postgres.password is required when postgres.enabled is true" .Values.postgres.password | urlquery) (include "fleet-rollout.name" .) | quote }}
  {{- else }}
  {{- fail "set database.url or database.existingSecret, or enable postgres" }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fleet-rollout.name" . }}-trust
  labels:
    {{- include "fleet-rollout.labels" . | nindent 4 }}
data:
  trust.pem: {{ required "trustKeys is required: the public keys trusted to sign artifacts" .Values.trustKeys | quote }}
