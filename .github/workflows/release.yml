name: Release

# Only plain version tags, such as v1.0.0, make a release. Milestone tags carry a suffix, such as
# v0.5.0-m4, and never match. The release starts as a draft, and its image is pushed only once a
# person publishes it (image.yml).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "!v*-*"

permissions:
  contents: read

jobs:
  binaries:
    name: Binaries and a draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
